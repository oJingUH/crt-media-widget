<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>CRT-MEDIA</title>
  <!-- Pixel-art CRT in the project palette: --bg #06120A, --dim #1E7A34,
       --base #33FF66, --bright #A6FFB8.  Same drawing as the Windows tray
       icon (app.py make_icon_image) and the GTK tray icon. -->
  <rect x="2" y="3" width="60" height="58" rx="9" ry="9"
        fill="#06120A" stroke="#1E7A34" stroke-width="2"/>
  <rect x="9" y="11" width="46" height="34" rx="4" ry="4"
        fill="#040C07" stroke="#33FF66" stroke-width="2"/>
  <polygon points="24,21 24,41 45,31" fill="#33FF66"/>
  <g stroke="#000000" stroke-opacity="0.28" stroke-width="1">
    <line x1="11" y1="14" x2="53" y2="14"/>
    <line x1="11" y1="17" x2="53" y2="17"/>
    <line x1="11" y1="20" x2="53" y2="20"/>
    <line x1="11" y1="23" x2="53" y2="23"/>
    <line x1="11" y1="26" x2="53" y2="26"/>
    <line x1="11" y1="29" x2="53" y2="29"/>
    <line x1="11" y1="32" x2="53" y2="32"/>
    <line x1="11" y1="35" x2="53" y2="35"/>
    <line x1="11" y1="38" x2="53" y2="38"/>
    <line x1="11" y1="41" x2="53" y2="41"/>
  </g>
  <rect x="13" y="15" width="3" height="3" fill="#A6FFB8"/>
  <rect x="25" y="54" width="14" height="3" fill="#1E7A34"/>
</svg>
